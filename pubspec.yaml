name: docdr
description: "Your documents, taken care of. A local-first mobile document workspace."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# Dependency discipline (docs/ENGINEERING_RULES.md):
# Every dependency must have a documented purpose, and its redistribution
# terms must be verified BEFORE it is introduced. See THIRD_PARTY_NOTICES.md
# and docs/PDF_TECHNOLOGY_EVALUATION.md for licence gate evidence.
#
# P2 PDF Technology Gate (2026-08-29) — VERIFIED ACCEPTED:
#   - pdfrx 2.4.7 MIT (rendering, PDFium BSD-3-Clause + permissive third-party)
#   - pdf 3.11.3 Apache-2.0 (generation)
# Both permissive, compatible with PROPRIETARY closed-source with attribution.
# Transitive deps all MIT/BSD-3-Clause/Apache-2.0, no GPL/AGPL/LGPL.
# See THIRD_PARTY_NOTICES.md for full matrix and attribution obligations.
dependencies:
  flutter:
    sdk: flutter
  pdfrx: ^2.4.7
  pdf: ^3.11.3
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
