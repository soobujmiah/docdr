# DocDr static analysis contract.
#
# The repository is evidence-first: `flutter analyze` must stay clean on every
# push. This file intentionally stays close to the Flutter defaults and adds a
# small number of rules that protect the document/template core.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat these as hard failures rather than warnings: silent type holes in
    # template deserialization are a security concern, not a style concern.
    invalid_assignment: error
    missing_return: error
    dead_code: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**

linter:
  rules:
    # Deserialization and generation must never print document contents.
    # See docs/SECURITY_PRIVACY.md - logs must avoid document contents.
    avoid_print: true
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_single_quotes: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
